[theme]
base = "dark"
primaryColor = "#58a6ff"
backgroundColor = "#060913"
secondaryBackgroundColor = "#0d1117"
textColor = "#e6edf3"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
